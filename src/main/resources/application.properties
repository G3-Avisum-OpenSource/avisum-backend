spring.application.name=avisum
server.port=${PORT:9090}

# Base de datos: en local usa estos valores por defecto; en Render se sobreescriben con variables de entorno
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/avisum?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Orígenes permitidos (frontend local y en Vercel)
avisum.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,https://*.vercel.app}

# US03: una alerta de pánico exige que el conductor tenga un turno activo
avisum.rules.alert-requires-active-shift=true